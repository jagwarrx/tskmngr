<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* VOICE: a working tool, calm and dense, nothing to read twice.
   IDEA: one table seen through eight filters, laid out like Things 3.
   PICTURE: the tool itself; Now is one big card, Week is a ChessDojo style calendar.
   COLOUR and TYPE: ChessDojo's own MUI theme: #121212 with elevation overlays, blue #90caf9, lilac #ce93d8, dojo orange #F7941F; Roboto only, 4px corners.
   LAYOUT: sidebar of views and projects, content up to 1080px, a panel slides in on the right. */
html,body,#root{height:100%}
body{margin:0;background:#121212}
:root[data-theme=light] body{background:#f6f7f9}
.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400;user-select:none}
#boot{font:15px Roboto,Arial,sans-serif;color:#999;padding:40px}
</style>
</head>
<body>
<div id="root"><div id="boot">Loading</div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@mui/material@5.16.7/umd/material-ui.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script>
{
const {useState, useEffect, useMemo} = React;
const {createTheme, ThemeProvider, CssBaseline, Box, Drawer, List, ListItemButton, ListItemIcon, ListItemText, ListSubheader, Typography, IconButton, Icon,
  Table, TableHead, TableBody, TableRow, TableCell, TableContainer, Paper, Chip, Checkbox, TextField, MenuItem, ToggleButton, ToggleButtonGroup,
  Card, Button, LinearProgress, CircularProgress, Stack, useMediaQuery, AppBar, Toolbar, Fab, Dialog, Snackbar, Alert, Tooltip, Popover, ButtonBase, MenuList, InputBase, Select, Menu} = MaterialUI;
const html = htm.bind(React.createElement);
const I = (name, sx) => html`<${Icon} baseClassName="material-symbols-rounded" sx=${{fontSize: 20, ...sx}}>${name}<//>`;

/* dates */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const TODAY = iso(new Date());
const day = n => iso(addDays(new Date(), n));
const weekStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return addDays(x, -x.getDay()); };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const hm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const tasksN = n => n === 1 ? ' task' : ' tasks';
const dur = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '') : m + 'm';
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const fmtDay = s => { if (!s) return ''; if (s === TODAY) return 'Today'; if (s === day(1)) return 'Tomorrow'; if (s === day(-1)) return 'Yesterday';
  const d = parse(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const clock = ms => { const a = Math.abs(Math.round(ms / 1000)); return (Math.floor(a / 3600) ? Math.floor(a / 3600) + ':' : '') + pad(Math.floor(a / 60) % 60) + ':' + pad(a % 60); };

const KEY = 'one-table-v3';
const migrate = s => ({...s, items: s.items.map(i => i.type === 'habit' && i.project ? {...i, type: 'task', status: 'todo', when: i.when || TODAY} : i)});
const load = () => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.items) return migrate(s); } catch (e) {} return {items: [], blocks: [], running: null, top: null}; };
const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); return true; } catch (e) { return false; } };

/* lookups */
const byId = (s, id) => s.items.find(i => i.id === id);
const projects = s => s.items.filter(i => i.type === 'project');
const milestones = (s, pid) => s.items.filter(i => i.type === 'milestone' && i.project === pid);
const tasksOf = (s, pid) => s.items.filter(i => i.type === 'task' && i.project === pid);
const habitsOf = () => [];
const msTasks = (s, mid) => s.items.filter(i => i.type === 'task' && i.milestone === mid);
/* weekly habits run on chosen days; each change is dated so earlier days keep the old schedule */
const ALLD = [0, 1, 2, 3, 4, 5, 6];
const daysOn = (h, dd) => { let cur = h.dow != null ? [+h.dow] : ALLD; (h.sched || []).forEach(e => { if (e.from <= dd) cur = e.days; }); return cur; };
const setDays = (h, days) => ({sched: [...(h.sched || []).filter(e => e.from < TODAY), {from: TODAY, days: [...days].sort()}]});
const habitOn = (h, dd) => h.from && dd < h.from ? false : h.repeat === 'weekly' ? daysOn(h, dd).includes(parse(dd).getDay()) : h.repeat === 'monthly' ? h.dom != null && parse(dd).getDate() === +h.dom : true;
const placeAt = (it, dd, m) => it.type === 'habit'
  ? {time: m == null ? null : hm(m), dur: it.dur || 15, ...(it.repeat === 'monthly' ? {dom: parse(dd).getDate()} : {})}
  : {when: dd, time: m == null ? null : hm(m), status: it.status === 'inbox' ? 'todo' : it.status, ...(it.type === 'event' ? {dur: it.dur || 60} : {})};
const archived = (s, i) => !!(i.archived || (i.project && (byId(s, i.project) || {}).archived));
const msPts = (s, mid) => msTasks(s, mid).reduce((n, t) => n + (+t.pts || 0), 0);
const ptsLabel = n => n ? ' (' + n + ')' : '';
const msDone = (s, m) => { const t = msTasks(s, m.id); return m.status === 'done' || (t.length > 0 && t.every(x => x.status === 'done')); };
const elapsed = (r, now) => (r.pausedAt || now) - r.start - (r.paused || 0);
const projOf = it => !it ? null : it.type === 'project' ? it.id : it.project;
const pct = (s, p) => { const t = tasksOf(s, p.id); return t.length ? Math.round(100 * t.filter(x => x.status === 'done').length / t.length) : 0; };
/* a project's first open task: first milestone's first task, else the first loose task */
const REP = {daily: 'every day', weekly: 'every week', monthly: 'every month', yearly: 'every year'};
const occ = (st, rep, k) => { const d = parse(st), y = d.getFullYear(), m = d.getMonth(), dd = d.getDate();
  if (rep === 'daily' || rep === 'weekly') return iso(addDays(d, k * (rep === 'daily' ? 1 : 7)));
  const ny = rep === 'yearly' ? y + k : y, nm = rep === 'yearly' ? m : m + k; return iso(new Date(ny, nm, Math.min(dd, new Date(ny, nm + 1, 0).getDate()))); };
/* a repeating event whose date has passed moves to its next date; the passed dates stay in past[] for the logs */
const stale = i => i.type === 'event' && REP[i.repeat] && i.when && i.when < TODAY;
const roll = i => { if (!stale(i)) return i; const st = i.start || i.when, past = [...(i.past || [])]; let k = 0, d;
  while ((d = occ(st, i.repeat, k)) < TODAY && k < 50000) { if (d >= i.when && !past.includes(d)) past.push(d); k++; }
  return {...i, when: d, status: 'todo', doneAt: null, start: st, past: past.slice(-400)}; };
const nextDue = it => { const b = it.when && it.when > TODAY ? parse(it.when) : new Date(); const d = new Date(b);
  if (it.repeat === 'weekly') d.setDate(d.getDate() + 7); else if (it.repeat === 'monthly') d.setMonth(d.getMonth() + 1); else d.setDate(d.getDate() + 1); return iso(d); };
const firstTask = (s, pid) => { const ok = t => t.status !== 'done' && !t.archived;
  for (const m of milestones(s, pid)) { const t = msTasks(s, m.id).find(ok); if (t) return t; } return tasksOf(s, pid).find(t => !t.milestone && ok(t)) || null; };
/* on a project's start date its first task shows on that day; a project with no open task shows itself */
const withStarts = s => { const m = {}; s.items.forEach(p => { if (p.type !== 'project' || !p.startDate || p.status === 'done') return; const t = firstTask(s, p.id); if (t && !t.when) m[t.id] = p.startDate; });
  return {...s, items: s.items.map(i => m[i.id] ? {...i, when: m[i.id], viaStart: true, status: i.status === 'inbox' ? 'todo' : i.status} : i)}; };
const startingOn = (s, dd) => s.items.filter(p => p.type === 'project' && p.startDate === dd && p.status !== 'done' && !firstTask(s, p.id));
const isTodayTask = i => i.type === 'task' && i.when && i.when <= TODAY && i.status !== 'inbox' && (i.status !== 'done' || (i.doneAt && iso(new Date(i.doneAt)) === TODAY));
const periodKey = (d, rep) => rep === 'monthly' ? d.slice(0, 7) : d;
const habitDone = h => (h.log || []).some(d => periodKey(d, h.repeat) === periodKey(TODAY, h.repeat));
function streak(h) { const keys = new Set((h.log || []).map(d => periodKey(d, h.repeat))); let d = new Date(), n = 0;
  if (h.repeat === 'weekly') { let k = 0; const back = () => { do { d = addDays(d, -1); k++; } while (k < 400 && !habitOn(h, iso(d))); };
    if (!habitOn(h, iso(d)) || !keys.has(iso(d))) back(); while (k < 400 && keys.has(iso(d))) { n++; back(); } return n; }
  const step = () => { d = h.repeat === 'monthly' ? new Date(d.getFullYear(), d.getMonth() - 1, 1) : addDays(d, -1); };
  if (!keys.has(periodKey(iso(d), h.repeat))) step();
  while (keys.has(periodKey(iso(d), h.repeat))) { n++; step(); } return n; }

const markHabit = (c, h) => c.upd(h.id, x => ({log: habitDone(x) ? (x.log || []).filter(d => periodKey(d, x.repeat) !== periodKey(TODAY, x.repeat)) : [...(x.log || []), TODAY]}));
const starToggle = (c, it) => c.upd(it.id, x => x.when === TODAY ? {when: null, time: null} : {when: TODAY, status: x.status === 'inbox' ? 'todo' : x.status});
function Star({c, it, size}) {
  const on = it.when && it.when <= TODAY && it.status !== 'done';
  return html`<${Tooltip} title=${on ? 'Take off Today' : 'Do today'}><${IconButton} size="small" aria-label=${on ? 'Take off Today' : 'Do today'} aria-pressed=${!!on}
    onClick=${e => { e.stopPropagation(); starToggle(c, it); }} sx=${{color: on ? '#f6c343' : 'text.disabled', '&:hover': {color: '#f6c343'}}}>
    <${Icon} baseClassName="material-symbols-rounded" sx=${{fontSize: size || 20, fontVariationSettings: on ? "'FILL' 1" : "'FILL' 0"}}>star<//><//><//>`;
}
const STATUS = ['inbox', 'todo', 'started', 'waiting', 'done'];
const SLABEL = {inbox: 'Inbox', todo: 'To do', started: 'Started', waiting: 'Waiting', done: 'Done'};
const SCOLOR = {inbox: 'default', todo: 'default', started: 'primary', waiting: 'warning', done: 'success'};
const KIND = {deep: '#6c9fd8', shallow: '#77b38c'}, PLAN = '#e99d4a', HABIT = '#ce93d8', EVENT = '#4db6ac', ON = 'rgba(0,0,0,.87)';
const Status = ({v}) => html`<${Chip} size="small" label=${SLABEL[v] || v} color=${SCOLOR[v] || 'default'} variant=${v === 'todo' || v === 'inbox' ? 'outlined' : 'filled'}/>`;
const VIEWS = ['inbox', 'now', 'planning', 'calendar', 'week', 'projects', 'tasks'];
const NAV = [['inbox', 'Inbox', 'inbox', '#90caf9'], 0, ['now', 'Now', 'play_circle', '#F7941F'], ['planning', 'Planning', 'dashboard', '#f6c343'], ['calendar', 'Calendar', 'calendar_month', '#ef8a80'],
  ['week', 'Dashboard', 'monitoring', '#ce93d8'], 0, ['projects', 'Projects', 'flag', '#4fc3f7'], ['tasks', 'Tasks', 'checklist', '#66bb6a']];
const hashView = () => { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : 'planning'; };
const themeMode = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
const makeTheme = mode => { const dark = mode === 'dark'; return createTheme({
  palette: {mode,
    primary: {main: dark ? '#90caf9' : '#1976d2'}, secondary: {main: dark ? '#ce93d8' : '#9c27b0'},
    success: {main: dark ? '#66bb6a' : '#2e7d32'}, warning: {main: dark ? '#ffa726' : '#ed6c02'}, info: {main: dark ? '#29b6f6' : '#0288d1'}, error: {main: dark ? '#f44336' : '#d32f2f'},
    dojo: {main: '#F7941F', light: '#f8a94b', dark: '#ac6715', contrastText: 'rgba(0, 0, 0, 0.87)'},
    background: dark ? {default: '#121212', paper: '#121212'} : {default: '#fff', paper: '#fff'}},
  shape: {borderRadius: 4},
  typography: {fontFamily: '"Roboto", "Helvetica", "Arial", sans-serif', button: {textTransform: 'none'}},
  components: {
    MuiTableCell: {styleOverrides: {head: {fontWeight: 500}}},
    MuiTableHead: {styleOverrides: {root: {'& .MuiTableCell-head': {backgroundColor: 'transparent'}}}},
    MuiToggleButton: {styleOverrides: {root: {textTransform: 'none'}}},
    MuiListItemButton: {styleOverrides: {root: {borderRadius: 4}}},
    MuiDrawer: {styleOverrides: {paper: {backgroundImage: 'none'}}}}}); };

/* shared pieces */
const Head = ({icon, color, title, sub, action}) => html`
  <${Stack} direction="row" alignItems="center" spacing=${1.5} sx=${{mb: 3}}>
    <${Box} sx=${{color, display: 'flex'}}>${I(icon, {fontSize: 30})}<//>
    <${Box} sx=${{flex: 1, minWidth: 0}}>
      <${Typography} variant="h4" component="h1">${title}<//>
      ${sub ? html`<${Typography} variant="body2" color="text.secondary" sx=${{mt: .5}}>${sub}<//>` : null}
    <//>
    ${action || null}
  <//>`;

function Row({c, it, pin, noDate}) {
  const p = it.project && byId(c.s, it.project), m = it.milestone && byId(c.s, it.milestone), done = it.status === 'done';
  return html`<${Box} draggable="true" onDragStart=${e => e.dataTransfer.setData('text/plain', it.id)} onClick=${() => c.open(it.id)}
      sx=${{display: 'flex', alignItems: 'center', gap: 1, pr: 1, borderRadius: 1, cursor: 'pointer', '&:hover': {bgcolor: 'action.hover'}}}>
    <${Checkbox} checked=${done} onClick=${e => e.stopPropagation()} onChange=${() => c.toggle(it)} icon=${I('radio_button_unchecked')}
      checkedIcon=${I('check_circle')} color="success" inputProps=${{'aria-label': 'Done'}}/>
    <${Box} sx=${{flex: 1, minWidth: 0, py: .75}}>
      <${Typography} noWrap sx=${{textDecoration: done ? 'line-through' : 'none', color: done ? 'text.disabled' : 'text.primary'}}>${it.name}<//>
      ${p ? html`<${Typography} variant="caption" color="text.secondary" noWrap component="div">${p.name}${m ? ', ' + m.name : ''}<//>` : null}
    <//>
    ${it.repeat && it.type === 'task' ? html`<${Tooltip} title=${'Repeats ' + it.repeat}>${I('repeat', {fontSize: 18, color: 'text.secondary'})}<//>` : null}
    ${it.images && it.images.length ? I('image', {fontSize: 18, color: 'text.secondary'}) : null}
    ${it.status === 'waiting' ? html`<${Chip} size="small" label="Waiting" variant="outlined" color="warning"/>` : null}
    ${!noDate && it.when && it.when !== TODAY && it.status !== 'done' ? html`<${Typography} variant="caption" color=${it.when < TODAY ? 'error' : 'text.secondary'}>${fmtDay(it.when)}<//>` : null}
    ${it.time ? html`<${Chip} size="small" variant="outlined" label=${it.time}/>` : null}
    ${it.type === 'task' ? html`<${Star} c=${c} it=${it}/>` : null}
    ${pin ? html`<${Tooltip} title="Put in the top 3"><${IconButton} size="small" aria-label="Put in the top 3" onClick=${e => { e.stopPropagation(); pin(it.id); }}>${I('keep', {fontSize: 18})}<//><//>` : null}
  <//>`;
}

function Heat({log, weeks = 22}) {
  const set = new Set(log || []), start = addDays(weekStart(new Date()), -7 * (weeks - 1)), cols = [];
  for (let w = 0; w < weeks; w++) { const first = addDays(start, w * 7); cols.push({label: first.getDate() <= 7 ? MON[first.getMonth()] : '', cells: [...Array(7)].map((_, d) => {
    const dd = iso(addDays(start, w * 7 + d)); return dd > TODAY ? 0 : set.has(dd) ? 2 : 1; })}); }
  const grid = {display: 'grid', gridAutoFlow: 'column', gridAutoColumns: '12px', gap: '3px'};
  return html`<${Box} sx=${{overflowX: 'auto', pb: 1}}><${Box} sx=${{display: 'grid', gridTemplateColumns: '30px auto', columnGap: 1, width: 'max-content'}}>
    <span></span>
    <${Box} sx=${{...grid, height: 18}}>${cols.map((c, k) => html`<${Typography} key=${k} variant="caption" color="text.secondary" sx=${{whiteSpace: 'nowrap', lineHeight: '14px'}}>${c.label}<//>`)}<//>
    <${Box} sx=${{display: 'grid', gridTemplateRows: 'repeat(7,12px)', gap: '3px'}}>${['', 'Mon', '', 'Wed', '', 'Fri', ''].map((l, k) => html`<${Typography} key=${k} variant="caption" color="text.secondary" sx=${{fontSize: 10, lineHeight: '12px'}}>${l}<//>`)}<//>
    <${Box} sx=${{...grid, gridTemplateRows: 'repeat(7,12px)'}}>${cols.map((c, w) => c.cells.map((v, d) => html`<${Box} key=${w + '-' + d}
      sx=${{width: 12, height: 12, borderRadius: '3px', bgcolor: v === 2 ? 'dojo.main' : v === 1 ? 'action.selected' : 'transparent'}}/>`))}<//>
  <//><//>`;
}

function lay(evs) {
  evs.sort((a, b) => a.start - b.start || b.min - a.min); const out = []; let g = [], end = -1;
  const flush = () => { const cols = []; g.forEach(e => { let k = cols.findIndex(t => t <= e.start); if (k < 0) { k = cols.length; cols.push(0); } cols[k] = e.start + e.min; e.col = k; });
    g.forEach(e => e.cols = cols.length); out.push(...g); g = []; };
  evs.forEach(e => { if (g.length && e.start >= end) { flush(); end = -1; } g.push(e); end = Math.max(end, e.start + e.min); });
  if (g.length) flush(); return out;
}
/* a slot drawn on the calendar: name it, pick task or event */
function NewSlot({c, draft, dd, onClose}) {
  const [name, setName] = useState(''), [type, setType] = useState(() => localStorage.getItem('one-table-newtype') || 'task');
  const save = () => { const n = name.trim(); if (n) { c.add({type, name: n, status: 'todo', when: dd, time: hm(draft.a), dur: draft.b - draft.a}); localStorage.setItem('one-table-newtype', type); } onClose(); };
  return html`<${Popover} open anchorReference="anchorPosition" anchorPosition=${{top: draft.y, left: draft.x}} onClose=${onClose} disableRestoreFocus
      PaperProps=${{elevation: 8, sx: {p: 1.5, width: 300}}}>
    <${Box} component="form" onSubmit=${e => { e.preventDefault(); save(); }}>
      <${Typography} variant="body2" color="text.secondary" sx=${{mb: 1}}>${fmtDay(dd)}, ${hm(draft.a)} to ${hm(draft.b)}<//>
      <${TextField} autoFocus fullWidth size="small" placeholder="Name" value=${name} onChange=${e => setName(e.target.value)} inputProps=${{'aria-label': 'Name'}}/>
      <${Stack} direction="row" alignItems="center" spacing=${1} sx=${{mt: 1.25}}>
        <${ToggleButtonGroup} size="small" exclusive value=${type} onChange=${(e, v) => v && setType(v)} aria-label="Kind">
          <${ToggleButton} value="task">Task<//><${ToggleButton} value="event">Event<//><//>
        <${Box} sx=${{flex: 1}}/>
        <${Button} type="submit" variant="contained" size="small" disabled=${!name.trim()}>Add<//>
      <//>
    <//>
  <//>`;
}
function Cal({c, days, from = 6, to = 23}) {
  const H = 52, nowD = new Date(c.now), nowMin = nowD.getHours() * 60 + nowD.getMinutes(), n = days.length, [drag, setDrag] = useState(null), sc = React.useRef(null);
  const base = [];
  days.forEach((dd, di) => {
    c.s.blocks.filter(b => b.day === dd).forEach(b => base.push({id: b.id, bid: b.id, item: b.item, di, start: toMin(b.start), min: b.min, bg: KIND[b.kind],
      tag: (b.kind === 'deep' ? 'Deep' : 'Shallow') + (b.mode === 'timer' ? ' timer' : ' block'), name: (byId(c.all || c.s, b.item) || {}).name || 'Block'}));
    c.s.items.filter(i => i.type === 'task' && i.when === dd && i.time)
      .forEach(i => base.push({id: 'p' + i.id, item: i.id, di, start: toMin(i.time), min: +i.dur || 30, plan: true, bg: PLAN, tag: i.repeat ? 'Repeats ' + i.repeat : 'Planned', name: i.name, done: i.status === 'done'}));
    c.s.items.filter(i => i.type === 'event' && i.when === dd && i.time)
      .forEach(i => base.push({id: 'e' + i.id, item: i.id, ev: true, di, start: toMin(i.time), min: +i.dur || 60, bg: EVENT, tag: i.reminder ? 'Reminder' : 'Event', name: i.name, done: i.status === 'done'}));
    c.s.items.filter(h => h.type === 'habit' && h.time && habitOn(h, dd))
      .forEach(h => base.push({id: 'h' + h.id + dd, item: h.id, hid: h.id, di, start: toMin(h.time), min: +h.dur || 15, bg: HABIT, tag: 'Habit', name: h.name, done: (h.log || []).includes(dd)})); });
  /* the timeline scrolls inside its own box; open it at the current time, or at the day's first item */
  useEffect(() => { const el = sc.current; if (!el) return;
    const at = days.includes(TODAY) && nowMin > from * 60 && nowMin < to * 60 ? nowMin : Math.min(8 * 60, ...base.map(e => e.start));

function Week({c}) {

  img.src = r.result; }; r.readAsDataURL(file); });

  const askNote = () => { try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} };
  const startGen = () => { askNote(); setNudge(false); if (!pick) { go('planning'); return; }
    setS(x => ({...x, running: {item: pick.id, start: Date.now(), planned: glen, kind: gkind, mode: 'play'}, items: x.items.map(i => i.id === pick.id && i.status === 'todo' ? {...i, status: 'started'} : i)})); go('now'); };
  useEffect(() => { if (!due) { if (nudge) setNudge(false); return; } const k = dueAt + ':' + Math.floor((now - dueAt) / GAP); if (k === nref.current) return; nref.current = k; setNudge(true);
    try { if (window.Notification && Notification.permission === 'granted' && document.hidden) new Notification('Time for a block', {body: pick ? pick.name : 'Pick a task in Planning', tag: 'tsk-gen'}); } catch (e) {} }, [due, now, dueAt]);
  const genBtn = small => s.running ? null : html`<${Tooltip} title=${due ? (pick ? 'Start a ' + glen + 'm ' + gkind + ' block on ' + pick.name : 'Pick a task in Planning') : 'Time to the next block'}>
    <${ButtonBase} onClick=${due ? startGen : () => go('planning')} sx=${{mr: 1, px: 1.25, height: 32, borderRadius: '16px', gap: .75, font: 'inherit', fontSize: 14, fontWeight: 600, whiteSpace: 'nowrap', flex: 'none',
      bgcolor: due ? 'dojo.main' : 'rgba(255,255,255,.16)', color: due ? 'dojo.contrastText' : 'inherit', '&:hover': {bgcolor: due ? 'dojo.light' : 'rgba(255,255,255,.26)'}}}>
      ${I(due ? 'play_arrow' : 'hourglass_top', {fontSize: 18})}${due ? (small ? 'Block' : 'Start a block') : html`<${Box} component="span" sx=${{fontVariantNumeric: 'tabular-nums'}}>${small ? '' : 'Next block in '}${clock(dueAt - now)}<//>`}<//><//>`;
  const count = v => v === 'inbox' ? vis.items.filter(i => i.status === 'inbox').length : v === 'archive' ? s.items.filter(i => i.archived).length || '' : v === 'today' ? vis.items.filter(i => isTodayTask(i) && i.status !== 'done').length
    : v === 'reminders' ? vis.items.filter(i => i.reminder && i.when === TODAY && i.status !== 'done').length || ''
    : v === 'now' && s.running ? clock(s.running.planned ? s.running.planned * 60000 - elapsed(s.running, now) : elapsed(s.running, now)) : '';
  const logo = html`<${Stack} direction="row" alignItems="center" spacing=${1.25}>
      <${Box} sx=${{width: 32, height: 32, borderRadius: '4px', bgcolor: 'dojo.main', color: 'dojo.contrastText', display: 'grid', placeItems: 'center'}}>${I('table_rows', {fontSize: 20})}<//>
      <${Typography} sx=${{fontWeight: 500, fontSize: 20}}>tskmngr<//><//>`;
  const side = html`<${Box} sx=${{width: 256, p: 1.5, display: 'flex', flexDirection: 'column', minHeight: '100%'}}>
    ${wide ? html`<${Toolbar}/>` : html`<${Box} sx=${{px: 1.5, py: 1.5}}>${logo}<//>`}
    <${List} dense>${NAV.map((n, k) => n ? html`<${ListItemButton} key=${n[0]} selected=${view === n[0] && !(n[0] === 'tasks' && pf !== 'all')} onClick=${() => { if (n[0] === 'tasks') setPf('all'); go(n[0]); }} sx=${{mb: .25}}>
        <${ListItemIcon} sx=${{minWidth: 36, color: n[3]}}>${I(n[2])}<//><${ListItemText} primary=${n[1]} primaryTypographyProps=${{fontWeight: 500, fontSize: 15}}/>
        <${Typography} variant="body2" color=${n[0] === 'now' ? 'dojo.main' : 'text.secondary'}>${count(n[0]) || ''}<//><//>` : html`<${Box} key=${'g' + k} sx=${{height: 10}}/>`)}<//>
    <${ListSubheader} disableSticky sx=${{bgcolor: 'transparent', lineHeight: '30px', mt: 1}}>Active projects<//>
    <${List} dense>${projects(vis).filter(p => p.active && p.status !== 'done').slice(0, 4).map(p => html`<${ListItemButton} key=${p.id} selected=${view === 'tasks' && pf === p.id} onClick=${() => { setPf(p.id); go('tasks'); }}>
      <${ListItemIcon} sx=${{minWidth: 36}}><${Box} sx=${{position: 'relative', width: 18, height: 18}}>
        <${CircularProgress} variant="determinate" value=${100} size=${18} thickness=${6} sx=${{color: 'action.selected', position: 'absolute'}}/>
        <${CircularProgress} variant="determinate" value=${pct(s, p)} size=${18} thickness=${6} sx=${{color: '#4fc3f7', position: 'absolute'}}/><//><//>
      <${ListItemText} primary=${p.name} primaryTypographyProps=${{noWrap: true, fontSize: 14}}/><//>`)}
      ${projects(vis).filter(p => p.active && p.status !== 'done').length > 4 ? html`<${ListItemButton} onClick=${() => go('projects')}>
        <${ListItemIcon} sx=${{minWidth: 36, color: 'text.secondary'}}>${I('more_horiz', {fontSize: 18})}<//>
        <${ListItemText} primary=${'All ' + projects(vis).filter(p => p.active && p.status !== 'done').length + ' projects'} primaryTypographyProps=${{fontSize: 14, color: 'text.secondary'}}/><//>` : null}<//>
  <//>`;
  const V = {inbox: Inbox, now: Now, planning: Planning, calendar: Calendar, week: Week, tasks: Tasks, projects: Projects}[view];
  return html`<${ThemeProvider} theme=${theme}><${CssBaseline}/>
    <${Box} sx=${{display: 'flex', minHeight: '100vh'}}>
      ${wide ? html`<${AppBar} position="fixed" elevation=${4} sx=${{zIndex: t => t.zIndex.drawer + 1}}><${Toolbar}>${logo}<${Box} sx=${{flex: 1}}/>
          ${genBtn(false)}${nextBtn(false)}
          ${s.running ? html`<${Button} color="dojo" variant="contained" startIcon=${I(s.running.pausedAt ? 'pause' : 'timer')} onClick=${() => go('now')} sx=${{maxWidth: 520, textTransform: 'none'}}>
            <${Box} component="span" sx=${{fontVariantNumeric: 'tabular-nums', fontWeight: 600}}>${count('now')}<//>
            ${runName ? html`<${Box} component="span" sx=${{ml: 1.25, pl: 1.25, borderLeft: '1px solid rgba(0,0,0,.3)', fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>${runName}<//>` : null}<//>` : null}
          ${s.running ? html`<${Tooltip} title="Pop out the timer"><${IconButton} color="inherit" aria-label="Pop out the timer" onClick=${popout} sx=${{ml: .5}}>${I('picture_in_picture_alt')}<//><//>` : null}
          ${SB ? html`<${Tooltip} title=${!user ? 'Sign in to sync' : sync.st === 'err' ? 'Sync failed' : sync.st === 'offline' ? 'Offline' : 'Synced'}><${IconButton} color="inherit" aria-label="Sync" onClick=${() => setAcct(true)}>${I(!user ? 'cloud_off' : sync.st === 'busy' ? 'cloud_sync' : sync.st === 'err' || sync.st === 'offline' ? 'cloud_alert' : 'cloud_done')}<//><//>` : null}
          ${html`<${Tooltip} title="Theme"><${IconButton} color="inherit" aria-label="Theme" onClick=${e => setThemeMenu(e.currentTarget)}>${I(pref === 'auto' ? 'contrast' : pref === 'light' ? 'light_mode' : 'dark_mode')}<//><//>`}<//><//>
        <${Drawer} variant="permanent" sx=${{width: 256, flexShrink: 0}} PaperProps=${{sx: {width: 256, borderColor: 'divider'}}}>${side}<//>`
        : html`<${Drawer} open=${navOpen} onClose=${() => setNavOpen(false)}>${side}<//>`}
      <${Box} component="main" sx=${{flex: 1, minWidth: 0}}>
        ${wide ? html`<${Toolbar}/>` : html`<${AppBar} position="sticky" elevation=${4}>
          <${Toolbar}><${IconButton} edge="start" color="inherit" aria-label="Menu" onClick=${() => setNavOpen(true)}>${I('menu')}<//>
            <${Typography} noWrap sx=${{ml: 1, flex: 1, fontSize: 20, fontWeight: 500}}>${NAV.find(n => n && n[0] === view)[1]}<//>
            ${s.running ? null : due ? genBtn(true) : nextBtn(true)}
            ${s.running ? html`<${Chip} size="small" color="dojo" label=${count('now') + (runName ? '  ' + runName : '')} onClick=${() => go('now')} sx=${{maxWidth: 200}}/>` : null}
            ${SB ? html`<${Tooltip} title=${!user ? 'Sign in to sync' : sync.st === 'err' ? 'Sync failed' : sync.st === 'offline' ? 'Offline' : 'Synced'}><${IconButton} color="inherit" aria-label="Sync" onClick=${() => setAcct(true)}>${I(!user ? 'cloud_off' : sync.st === 'busy' ? 'cloud_sync' : sync.st === 'err' || sync.st === 'offline' ? 'cloud_alert' : 'cloud_done')}<//><//>` : null}
          ${html`<${Tooltip} title="Theme"><${IconButton} color="inherit" aria-label="Theme" onClick=${e => setThemeMenu(e.currentTarget)}>${I(pref === 'auto' ? 'contrast' : pref === 'light' ? 'light_mode' : 'dark_mode')}<//><//>`}<//><//>`}
        <${Box} sx=${{maxWidth: view === 'planning' || view === 'projects' && pm === 'canvas' ? 'none' : ['week', 'calendar', 'tasks', 'projects', 'now'].includes(view) ? 1280 : 1080, mx: 'auto', px: {xs: 2, md: view === 'planning' ? 3 : 5}, py: {xs: 2.5, md: view === 'planning' ? 2.5 : 4}}}><${V} c=${c}/><//>
      <//>
    <//>
    <${Panel} c=${c}/>
    <${Account} open=${acct} onClose=${() => setAcct(false)} user=${user} sync=${sync} run=${runSync}/>
    <${Menu} anchorEl=${themeMenu} open=${!!themeMenu} onClose=${() => setThemeMenu(null)} disableRestoreFocus>
      ${[['light', 'Light', 'light_mode'], ['dark', 'Dark', 'dark_mode'], ['auto', 'Match system', 'contrast']].map(([v, l, ic]) => html`<${MenuItem} key=${v} selected=${pref === v} onClick=${() => setPref(v)}>
        ${I(ic, {mr: 1.5, fontSize: 20})}<${Box} sx=${{flex: 1, mr: 3}}>${l}<//>${pref === v ? I('check', {fontSize: 18, color: 'primary.main'}) : null}<//>`)}<//>
    <${Snackbar} open=${!!undo} autoHideDuration=${8000} onClose=${(e, r) => r !== 'clickaway' && setUndo(null)} message=${undo ? undo.msg : ''}
      action=${undo && undo.prev ? html`<${Button} color="primary" onClick=${() => { setS(undo.prev); setUndo(null); }}>Undo<//>` : null}/>
    <${Snackbar} open=${nudge && due} anchorOrigin=${{vertical: 'bottom', horizontal: 'center'}} message=${'No block in the last 10 minutes' + (pick ? '. Next: ' + pick.name : '')}
      action=${html`<${Button} color="primary" onClick=${() => { askNote(); setNudge(false); setSnooze(Date.now() + GAP); }}>Snooze 10m<//>
        <${Button} variant="contained" color="dojo" size="small" startIcon=${I('play_arrow')} onClick=${startGen} sx=${{ml: .5}}>${pick ? 'Start ' + glen + 'm' : 'Pick a task'}<//>`}/>
    <${Snackbar} open=${full}><${Alert} severity="warning" variant="filled">Not saved: this browser's storage is full. Remove an image.<//><//>
  <//>`;
}

if ('serviceWorker' in navigator && location.protocol === 'https:' && !framed) navigator.serviceWorker.register('sw.js').catch(() => {});
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
</script>
</body>
</html>
